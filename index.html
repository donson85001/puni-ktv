<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>噗妮歌單</title>

<style>
  body{ margin:0; background:#111; color:#fff; font-family: Arial, "Noto Sans TC", sans-serif; }
  a{ color:#ff69b4; text-decoration:none; }
  a:hover{ text-decoration:underline; }

  .hero{ position:relative; height:260px; overflow:hidden; border-bottom:2px solid #222; }
  .hero img.bg{
    width:100%; height:100%; object-fit:cover; display:block;
    opacity:.5; filter: brightness(.9);
  }

  .topbar{
    position:absolute; top:14px; left:14px; right:14px;
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand img{
    width:56px; height:56px; border-radius:12px; object-fit:cover;
    border:2px solid rgba(255,105,180,0.6); background:#222;
  }
  .brand .title{
    font-size:28px; font-weight:900; letter-spacing:1px;
    text-shadow:0 2px 10px rgba(0,0,0,0.6);
  }

  .nav{ display:flex; gap:10px; flex-wrap:wrap; }
  .nav-tab{
    background: transparent;
    color:#fff;
    border:1px solid #fff;
    padding:8px 14px;
    border-radius:10px;
    cursor:pointer;
    font-weight:900;
    transition: all .2s ease;
  }
  .nav-tab:hover{
    background:#111;
    border-color:#ff69b4;
    color:#fff;
  }
  .nav-tab.active{
    background:#ff69b4;
    border-color:#ff69b4;
    color:#fff;
  }
  .nav-admin{
    background: rgba(255,105,180,0.92);
    color:#fff;
    border:none;
    padding:8px 12px;
    border-radius:10px;
    cursor:pointer;
    font-weight:900;
  }

  .container{ width:min(1100px, 92%); margin:18px auto; }
  .toolbar{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin:14px 0; }

  input[type="text"], input[type="number"], input[type="password"], select{
    background:#1b1b1b; border:1px solid #333; color:#fff;
    padding:10px 12px; border-radius:10px; outline:none;
  }

  .btn{
    background:#ff69b4; color:#fff; border:none;
    padding:10px 12px; border-radius:10px; cursor:pointer; font-weight:900;
  }
  .btn.gray{ background:#2a2a2a; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }

  .tab-btn{
    background:#2a2a2a;
    color:#fff;
    border:1px solid transparent;
    padding:10px 12px;
    border-radius:10px;
    cursor:pointer;
    font-weight:900;
    transition: all .2s ease;
  }
  .tab-btn:hover{
    background:#111;
    color:#fff;
    border-color:#ff69b4;
  }
  .tab-btn.active{
    background:#ff69b4;
    color:#fff;
    border-color:#ff69b4;
  }

  .song-card{
    background:#1e1e1e; border-radius:14px;
    padding:14px; margin:10px 0;
    display:flex; justify-content:space-between; align-items:center;
    border-left:7px solid #ff69b4; min-height:78px;
  }
  .song-left{ display:flex; flex-direction:column; gap:6px; }
  .song-name{ font-size:18px; font-weight:900; letter-spacing:.5px; }
  .song-meta{ opacity:.85; font-size:13px; }
  .star{ color:gold; font-weight:900; margin-left:6px; }

  .chip{
    display:inline-block;
    background:#2a2a2a;
    color:#fff;
    padding:6px 10px;
    border-radius:999px;
    margin:4px 6px 0 0;
    cursor:pointer;
    border:1px solid transparent;
    font-weight:900;
    transition: all .2s ease;
  }
  .chip:hover{
    background:#111;
    color:#fff;
    border-color:#ff69b4;
  }
  .chip.active{
    background:#ff69b4;
    color:#fff;
    border-color:#ff69b4;
  }

  .pagination{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin:16px 0 24px; }

  .page{ display:none; }
  .page.active{ display:block; }

  .login-box{
    background:#1b1b1b; border:1px solid #333; border-radius:14px;
    padding:14px; display:none; margin:10px 0;
  }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.55);
    display:none; align-items:center; justify-content:center; padding:16px;
  }
  .modal{
    width:min(560px, 96%);
    background:#141414; border:1px solid #333; border-radius:16px;
    padding:16px;
  }
  .modal h3{ margin:0 0 10px; font-size:18px; font-weight:900; }
  .row{ display:flex; gap:10px; flex-wrap:wrap; margin:10px 0; }
  label{ display:block; font-size:13px; opacity:.9; margin-bottom:6px; font-weight:900; }
  .field{ flex:1; min-width:220px; }
  .hint{ opacity:.8; font-size:13px; }

  .home-block{
    background:#1b1b1b; border:1px solid #333; border-radius:16px;
    padding:16px; margin:14px 0; line-height:1.8;
  }
  .home-block h2{ margin:0 0 10px; font-size:18px; font-weight:900; }

  .seal-bottom{
    text-align:center;
    font-size:92px;
    margin:18px 0 56px;
  }

  .error-banner{
    background:#2b1f27;
    border:1px solid #ff69b4;
    border-radius:14px;
    padding:12px 14px;
    margin:12px 0;
    display:none;
    white-space:pre-wrap;
  }
</style>
</head>

<body>

<div class="hero">
  <img class="bg" src="bg.jpg" alt="top-bg" />

  <div class="topbar">
    <div class="brand">
      <img src="cute.gif" alt="cute-gif" />
      <div class="title">噗妮歌單</div>
    </div>

    <div class="nav">
      <button id="nav-home" class="nav-tab" onclick="goPage('home')">首頁</button>
      <button id="nav-songs" class="nav-tab" onclick="goPage('songs')">點歌</button>
      <button id="nav-ranking" class="nav-tab" onclick="goPage('ranking')">排行榜</button>
      <button class="nav-admin" onclick="toggleLogin()">管理者</button>
    </div>
  </div>
</div>

<div class="container">
  <div class="error-banner" id="errBox"></div>

  <div class="login-box" id="loginBox">
    <div class="toolbar" style="margin:0;">
      <input type="text" id="username" placeholder="帳號" />
      <input type="password" id="password" placeholder="密碼" />
      <button class="btn" onclick="login()">登入</button>
      <button class="btn gray" id="logoutBtn" onclick="logout()" style="display:none;">登出</button>
      <span id="loginStatus" class="hint"></span>
    </div>
  </div>

  <div class="page active" id="page-home">
    <div class="home-block">
      <h2>感謝各位支持~</h2>
      <div>大家有希望可以聽到的歌 也可以投入許願池中</div>
      <div style="margin-top:8px;">
        <a href="https://docs.google.com/forms/d/1zg8hLVJbUtwhl8CI2ItqcC_GoTshKo49zmcHYimVfjo/edit" target="_blank" rel="noopener">許願池（點我）</a>
      </div>
    </div>

    <div class="home-block">
      <h2>喜歡的話也可以給一點點打賞金</h2>
      <div style="margin-top:8px;">
        <a href="https://donation-goal.hikarunogo.com.tw/Donate/Opay/3B4116F0A4064BB35254CDF1B9ED84E9" target="_blank" rel="noopener">打賞（點我）</a>
      </div>
      <div style="margin-top:10px;">再次感謝各位支持~</div>
    </div>

    <div class="seal-bottom">🦭</div>
  </div>

  <div class="page" id="page-songs">
    <div class="toolbar">
      <input type="text" id="search" placeholder="搜尋歌名或歌手（不分大小寫）" />

      <button id="btn-female" class="tab-btn" onclick="setCategory('女歌手')">女歌手</button>
      <button id="btn-male" class="tab-btn" onclick="setCategory('男歌手')">男歌手</button>
      <button id="btn-other" class="tab-btn" onclick="setCategory('其他')">其他</button>
      <button id="btn-all" class="tab-btn" onclick="setCategory('全部')">全部</button>

      <button id="btn-adminAdd" class="btn" style="display:none;" onclick="openAdminAddSong()">新增歌曲</button>
    </div>

    <div id="singerBar"></div>
    <div id="otherSubBar"></div>

    <div id="songList"></div>
    <div class="pagination" id="pagination"></div>
  </div>

  <div class="page" id="page-ranking">
    <div class="toolbar">
      <div class="hint">排行榜：前 40 名（每頁 10 首）</div>
    </div>
    <div id="rankList"></div>
    <div class="pagination" id="rankPagination"></div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3>新增歌曲</h3>
    <div class="hint">（管理者）新增到試算表</div>

    <div class="row">
      <div class="field">
        <label>分類（工作表）</label>
        <select id="mSheet" onchange="onSheetChange()">
          <option value="女歌手">女歌手</option>
          <option value="男歌手">男歌手</option>
          <option value="其他">其他</option>
        </select>
      </div>

      <div class="field" id="subtagSelectField" style="display:none;">
        <label>其他子標籤</label>
        <select id="mSubtagSelect">
          <option value="日">日</option>
          <option value="英">英</option>
          <option value="Rap">Rap</option>
          <option value="情歌對唱">情歌對唱</option>
          <option value="嗨歌/怪歌">嗨歌/怪歌</option>
          <option value="舞蹈">舞蹈</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label>歌名</label>
        <input type="text" id="mSongName" />
      </div>
      <div class="field">
        <label>歌手</label>
        <input type="text" id="mSinger" />
      </div>
    </div>

    <div class="row">
      <div class="field">
        <label>不熟標記</label>
        <button class="btn gray" id="starToggleBtn" onclick="toggleStar()">☆ 未標記</button>
        <div class="hint">按一下變 ★，再按一下取消</div>
      </div>

      <div class="field">
        <label>播放次數</label>
        <input type="number" id="mPlays" value="0" min="0" />
      </div>
    </div>

    <div class="row" style="justify-content:flex-end;">
      <button class="btn gray" onclick="closeAddSong()">取消</button>
      <button class="btn" onclick="submitAdminAddSong()">送出新增</button>
    </div>
  </div>
</div>

<script>
  // ✅ 換成你 Apps Script /exec（使用這份後端 Code.gs 部署）
  const apiUrl = "https://script.google.com/macros/s/AKfycbyIuW2aihuH8DD27HIo3fRHF8_VSVia7Ekx6a7Q2TKlHec8rU6ASy_Eb2IjslcVDHM1/exec";

  const OTHER_SUBTAGS = ["日","英","Rap","情歌對唱","嗨歌/怪歌","舞蹈"];

  let allSongs = [];
  let token = localStorage.getItem("ktv_token") || null;

  let category = "全部";
  let selectedSinger = null;
  let selectedSubtag = null;

  let listPage = 1;
  const pageSize = 10;

  let rankPage = 1;

  // 男女歌手「其他」收納狀態
  let femaleOtherExpanded = false;
  let femaleOtherSelected = false;
  
  let femaleOtherListMode = false; // 女歌手：單曲歌手歌曲列表模式
let maleOtherExpanded = false;
  let maleOtherSelected = false;

  // modal state
  let starSelected = false;

  function showError(msg){
    const box = document.getElementById("errBox");
    box.style.display = "block";
    box.textContent = msg;
  }
  function clearError(){
    const box = document.getElementById("errBox");
    box.style.display = "none";
    box.textContent = "";
  }

  // ===== JSONP（解決 GitHub Pages → Apps Script CORS） =====
  function jsonp(params){
    return new Promise((resolve, reject)=>{
      const cb = "cb_" + Math.random().toString(36).slice(2);
      const q = new URLSearchParams({ ...params, callback: cb }).toString();
      const src = apiUrl + "?" + q;

      const script = document.createElement("script");
      script.src = src;
      script.async = true;

      window[cb] = (data)=>{
        try { resolve(data); }
        finally {
          delete window[cb];
          script.remove();
        }
      };

      script.onerror = ()=>{
        delete window[cb];
        script.remove();
        reject(new Error("JSONP 載入失敗"));
      };

      document.head.appendChild(script);
    });
  }

  function initLoginUI(){
    if(token){
      logoutBtn.style.display="inline-block";
      loginStatus.textContent="已登入（按登出才會登出）";
      document.getElementById("btn-adminAdd").style.display = "inline-block";
    }else{
      logoutBtn.style.display="none";
      loginStatus.textContent="";
      document.getElementById("btn-adminAdd").style.display = "none";
    }
  }

  function toggleLogin(){
    loginBox.style.display = (loginBox.style.display==="block") ? "none" : "block";
  }

  async function loadAllSongs(){
    clearError();
    const data = await jsonp({ action:"getSongs" });
    if(!Array.isArray(data)){
      throw new Error("資料格式不是陣列，請確認後端 doGet 回傳。");
    }
    allSongs = data;
  }

  function login(){
    clearError();
    jsonp({
      action:"login",
      username: username.value,
      password: password.value
    }).then(res=>{
      if(res.status==="success"){
        token=res.token;
        localStorage.setItem("ktv_token", token);
        initLoginUI();
        loginBox.style.display="none";
        renderSongsPage();
        renderRankingPage();
      }else{
        alert("帳號密碼錯誤");
      }
    }).catch(err=>showError("登入失敗：\n"+String(err)));
  }

  function logout(){
    localStorage.removeItem("ktv_token");
    token=null;
    initLoginUI();
    renderSongsPage();
    renderRankingPage();
  }

  function goPage(name){
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    document.getElementById("page-"+name).classList.add("active");

    document.querySelectorAll(".nav-tab").forEach(b=>b.classList.remove("active"));
    const map = { home:"nav-home", songs:"nav-songs", ranking:"nav-ranking" };
    if(map[name]) document.getElementById(map[name]).classList.add("active");

    if(name==="songs") renderSongsPage();
    if(name==="ranking") renderRankingPage();
  }

  function applyCategoryButtonState(){
    const map = {
      "女歌手": "btn-female",
      "男歌手": "btn-male",
      "其他": "btn-other",
      "全部": "btn-all"
    };
    Object.values(map).forEach(id => document.getElementById(id).classList.remove("active"));
    const id = map[category];
    if(id) document.getElementById(id).classList.add("active");
  }

  function setCategory(c){
    category=c;
    selectedSinger=null;
    selectedSubtag=null;
    listPage=1;

    femaleOtherExpanded = false;
    femaleOtherSelected = false;
    maleOtherExpanded = false;
    maleOtherSelected = false;

    

    femaleOtherListMode = false;
    maleOtherListMode = false;
applyCategoryButtonState();
    renderSongsPage();
  }

  search.addEventListener("input", ()=>{ listPage=1; renderSongsPage(); });

  function renderSingerBar(){
    singerBar.innerHTML="";

    if(category==="全部"){
      singerBar.innerHTML = `<div class="hint">選女歌手/男歌手/其他後，這裡會出現歌手名單</div>`;
      return;
    }

    const bucket = allSongs.filter(s=>s.sheetName===category);

    const countMap = new Map();
    bucket.forEach(s=>{
      const name = (s["歌手"]||"").trim();
      if(!name) return;
      countMap.set(name, (countMap.get(name)||0) + 1);
    });

    const singersAll = [...countMap.keys()]
      .sort((a,b)=>String(a).localeCompare(String(b),"zh-Hant"));

    if(category==="女歌手" || category==="男歌手"){
      const isFemale = (category==="女歌手");

      const mainSingers = singersAll.filter(n => (countMap.get(n)||0) >= 2);
      const singleSingers = singersAll.filter(n => (countMap.get(n)||0) === 1);

      let otherExpanded = isFemale ? femaleOtherExpanded : maleOtherExpanded;
      let otherSelected = isFemale ? (femaleOtherSelected || femaleOtherListMode) : (maleOtherSelected || maleOtherListMode);

      const setOtherState = (expanded, selected)=>{
        if(isFemale){ femaleOtherExpanded = expanded; femaleOtherSelected = selected; }
        else { maleOtherExpanded = expanded; maleOtherSelected = selected; }
      };

      mainSingers.forEach(name=>{
        const chip=document.createElement("span");
        chip.className="chip"+(name===selectedSinger ? " active" : "");
        chip.textContent=name;
        chip.onclick=()=>{
          setOtherState(false,false);
          if(isFemale){ femaleOtherListMode=false; } else { maleOtherListMode=false; }
          selectedSinger = (selectedSinger===name)?null:name;
          listPage=1;
          renderSongsPage();
        };
        singerBar.appendChild(chip);
      });

      if(singleSingers.length>0){
      const otherChip=document.createElement("span");
      otherChip.className="chip"+(otherSelected ? " active" : "");
      // ✅ 點「其他」後直接顯示所有「只有一首歌」的歌曲列表，不顯示歌手子標題
      const listMode = isFemale ? femaleOtherListMode : maleOtherListMode;
      otherChip.textContent = listMode ? `其他（單曲歌手） ✓` : `其他（單曲歌手）`;
      otherChip.onclick=()=>{
        if(isFemale){
          femaleOtherListMode = !femaleOtherListMode;
        }else{
          maleOtherListMode = !maleOtherListMode;
        }
        // 不展開歌手子清單
        setOtherState(false, (isFemale ? femaleOtherListMode : maleOtherListMode));
        selectedSinger = null;
        listPage=1;
        renderSongsPage();
      };
      singerBar.appendChild(otherChip);
    }

    if(mainSingers.length===0 && singleSingers.length===0){
        singerBar.innerHTML = `<div class="hint">${category}目前沒有資料</div>`;
      }
      return;
    }

    singersAll.forEach(name=>{
      const chip=document.createElement("span");
      chip.className="chip"+(name===selectedSinger?" active":"");
      chip.textContent=name;
      chip.onclick=()=>{
        selectedSinger = (selectedSinger===name)?null:name;
        listPage=1;
        renderSongsPage();
      };
      singerBar.appendChild(chip);
    });

    if(singersAll.length===0){
      singerBar.innerHTML = `<div class="hint">這個分類目前沒有資料</div>`;
    }
  }

  function renderOtherSubBar(){
    otherSubBar.innerHTML = "";
    if(category !== "其他"){
      selectedSubtag = null;
      return;
    }
    OTHER_SUBTAGS.forEach(tag=>{
      const chip = document.createElement("span");
      chip.className = "chip" + (tag===selectedSubtag ? " active" : "");
      chip.textContent = tag;
      chip.onclick = ()=>{
        selectedSubtag = (selectedSubtag===tag ? null : tag);
        listPage = 1;
        renderSongsPage();
      };
      otherSubBar.appendChild(chip);
    });
  }

  function getFilteredSongs(){
    const q=(search.value||"").trim();
    let data=[...allSongs];

    if(category!=="全部") data=data.filter(s=>s.sheetName===category);
    if(selectedSinger) data=data.filter(s=>(s["歌手"]||"")===selectedSinger);


    // ✅ 女/男歌手：若選了「其他（單曲歌手）」就直接顯示所有只有一首歌的歌手之歌曲
    if((category==="女歌手" && femaleOtherListMode) || (category==="男歌手" && maleOtherListMode)){
      const bucket = allSongs.filter(s=>s.sheetName===category);
      const countMap = new Map();
      bucket.forEach(s=>{
        const name = (s["歌手"]||"").trim();
        if(!name) return;
        countMap.set(name, (countMap.get(name)||0) + 1);
      });
      data = data.filter(s => (countMap.get((s["歌手"]||"").trim())||0) === 1);
    }

    if(category==="其他" && selectedSubtag){
      data = data.filter(s => String(s["子標籤"]||"").includes(selectedSubtag));
    }

    if(q){
      const qq = q.toLowerCase();
      data = data.filter(s=>{
        const name = String(s["歌名"]||"").toLowerCase();
        const singer = String(s["歌手"]||"").toLowerCase();
        return name.includes(qq) || singer.includes(qq);
      });
    }
  // ⭐ 新增這行：依播放次數排序
  data.sort((a,b)=>Number(b["播放次數"]||0)-Number(a["播放次數"]||0));
    return data;
  }

  function renderSongsPage(){
    renderSingerBar();
    renderOtherSubBar();

    const data=getFilteredSongs();
    const totalPages=Math.max(1, Math.ceil(data.length/pageSize));
    if(listPage>totalPages) listPage=1;

    const start=(listPage-1)*pageSize;
    const pageData=data.slice(start, start+pageSize);

    songList.innerHTML="";
    if(pageData.length===0){
      songList.innerHTML = `<div class="hint">沒有符合條件的歌曲</div>`;
    }

    pageData.forEach(song=>{
      const card=document.createElement("div");
      card.className="song-card";

      const star = (song["星號"]==="★") ? `<span class="star">★</span>` : "";
      const plays = Number(song["播放次數"]||0);

      card.innerHTML=`
        <div class="song-left">
          <div class="song-name">${esc(song["歌名"]||"")} - ${esc(song["歌手"]||"")} ${star}</div>
          <div class="song-meta">
            分類：${song.sheetName}
            ${song.sheetName==="其他" && song["子標籤"] ? "｜ 子標籤："+esc(song["子標籤"]) : ""}
            ｜ 播放次數：<span id="plays-${song.sheetName}-${song.rowIndex}">${plays}</span>
          </div>
        </div>
        <div>
          ${token ? `<button class="btn" onclick="addClick('${song.sheetName}',${song.rowIndex})">+1</button>`:""}
        </div>
      `;
      songList.appendChild(card);
    });

    pagination.innerHTML="";
    for(let i=1;i<=totalPages;i++){
      const b=document.createElement("button");
      b.className="btn gray";
      b.textContent=i;
      b.onclick=()=>{ listPage=i; renderSongsPage(); };
      pagination.appendChild(b);
    }
  }

  function buildRanking(){
    return [...allSongs]
      .sort((a,b)=>Number(b["播放次數"]||0)-Number(a["播放次數"]||0))
      .slice(0,40);
  }

  function renderRankingPage(){
    const rankData=buildRanking();
    const totalPages=Math.max(1, Math.ceil(rankData.length/pageSize));
    if(rankPage>totalPages) rankPage=1;

    const start=(rankPage-1)*pageSize;
    const pageData=rankData.slice(start, start+pageSize);

    rankList.innerHTML="";
    if(pageData.length===0){
      rankList.innerHTML = `<div class="hint">目前沒有排行榜資料</div>`;
    }

    pageData.forEach((song,idx)=>{
      const card=document.createElement("div");
      card.className="song-card";
      const rankNo=start+idx+1;
      const star = (song["星號"]==="★") ? `<span class="star">★</span>` : "";
      const plays = Number(song["播放次數"]||0);

      card.innerHTML=`
        <div class="song-left">
          <div class="song-name">#${rankNo} ${esc(song["歌名"]||"")} - ${esc(song["歌手"]||"")} ${star}</div>
          <div class="song-meta">分類：${song.sheetName} ｜ 播放次數：${plays}</div>
        </div>
        <div>
          ${token ? `<button class="btn" onclick="addClick('${song.sheetName}',${song.rowIndex})">+1</button>`:""}
        </div>
      `;
      rankList.appendChild(card);
    });

    rankPagination.innerHTML="";
    for(let i=1;i<=totalPages;i++){
      const b=document.createElement("button");
      b.className="btn gray";
      b.textContent=i;
      b.onclick=()=>{ rankPage=i; renderRankingPage(); };
      rankPagination.appendChild(b);
    }
  }

  function addClick(sheetName,rowIndex){
    clearError();
    jsonp({ action:"addClick", token, sheetName, rowIndex })
    .then(res=>{
      if(res.status==="updated"){
        const el=document.getElementById(`plays-${sheetName}-${rowIndex}`);
        if(el) el.textContent = String(Number(el.textContent||0)+1);

        const item=allSongs.find(s=>s.sheetName===sheetName && s.rowIndex===rowIndex);
        if(item) item["播放次數"]=Number(item["播放次數"]||0)+1;

        renderRankingPage();
      }else{
        alert("登入已過期，請重新登入");
        logout();
      }
    })
    .catch(err=>showError("+1 失敗：\n"+String(err)));
  }

  function openAdminAddSong(){
    if(!token){
      alert("請先管理者登入");
      return;
    }
    mSheet.value = "女歌手";
    onSheetChange();
    mSongName.value = "";
    mSinger.value = "";
    mPlays.value = 0;
    starSelected = false;
    refreshStarBtn();
    modalOverlay.style.display="flex";
  }

  function closeAddSong(){ modalOverlay.style.display="none"; }

  function onSheetChange(){
    const isOther = (mSheet.value === "其他");
    subtagSelectField.style.display = isOther ? "block" : "none";
  }

  function toggleStar(){
    starSelected = !starSelected;
    refreshStarBtn();
  }
  function refreshStarBtn(){
    if(starSelected){
      starToggleBtn.textContent="★ 已標記";
      starToggleBtn.className="btn";
    }else{
      starToggleBtn.textContent="☆ 未標記";
      starToggleBtn.className="btn gray";
    }
  }

  function submitAdminAddSong(){
    clearError();
    const sheetName = mSheet.value;
    const songName = mSongName.value.trim();
    const singer = mSinger.value.trim();
    const plays = Number(mPlays.value||0);
    if(!songName || !singer){
      alert("請至少填：歌名、歌手");
      return;
    }
    const subtag = (sheetName === "其他") ? (mSubtagSelect.value || "") : "";

    jsonp({
      action:"addSong",
      token,
      sheetName,
      songName,
      singer,
      star: starSelected,
      plays,
      subtag
    }).then(async res=>{
      if(res.status==="added"){
        closeAddSong();
        await loadAllSongs();
        renderSongsPage();
        renderRankingPage();
        alert("新增成功，已回寫試算表");
      }else if(res.status==="unauthorized"){
        alert("登入已過期，請重新登入");
        logout();
      }else{
        alert("新增失敗："+(res.status||"unknown"));
      }
    }).catch(err=>showError("新增失敗：\n"+String(err)));
  }

  function esc(s){
    return String(s)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  // ===== 初始化 =====
  initLoginUI();
  document.getElementById("nav-home").classList.add("active");

  loadAllSongs()
    .then(() => { applyCategoryButtonState(); renderSongsPage(); renderRankingPage(); })
    .catch(err => showError(
      "無法載入歌單資料。\n" +
      "請確認：\n" +
      "1) index.html 的 apiUrl 已改成你的 /exec\n" +
      "2) Apps Script 已部署為網路應用程式（任何人可存取）\n" +
      "3) 試算表有三個工作表：女歌手、男歌手、其他\n\n" +
      "錯誤訊息：\n" + String(err)
    ));
</script>

</body>
</html>
